[base]
env_name = rock_paper_scissors
checkpoint_interval = 100

[vec]
num_policies = 1
hist_policy_percent = 0

[selfplay]
# Historical-opponent pool stays off; mode 5 uses two slots of policy 0.
enabled = 0
max_size = 16
opp_timeout_steps = 1000

[env]
# 0 = uniform, 1 = counter previous move, 2 = always rock after opening.
# 3 = random scripted bot, 4 = current-policy self-play.
# 5 = weighted rock/counter/self-play mixture, selected at each match reset.
# Scripted bots open uniformly. Self-play uses the policy on both sides.
bot_policy = 5
# Remaining probability is split equally between rock and counter.
selfplay_share = 0.3333333333333333

[policy]
hidden_size = 64
num_layers = 4

[train]
total_timesteps = 200_000_000
