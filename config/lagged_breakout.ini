[base]
env_name = lagged_breakout

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[policy]
num_layers = 2
hidden_size = 64

[env]
num_agents = 1
# One microstep is an original 1/60-second Breakout physics frame.
frameskip = 4
# Dispatch at microstep k; first apply at k + action_lag. Maximum 64.
action_lag = 0
# Isotropic position diffusion, in pixels / sqrt(second).
volatility = 0.0
# Pay accumulated brick points at this many microsteps; multiple of frameskip.
reward_interval = 4
# Independent environment seed; vector slot i uses seed + i.
seed = 0

[train]
# Original Breakout training settings, held fixed during lag comparisons.
total_timesteps = 94_000_000
beta1 = 0.7279714073125252
beta2 = 0.9986265112492152
clip_coef = 0.6746497927896418
ent_coef = 0.0033240721522812535
eps = 0.00008339460257113628
gae_lambda = 0.948721675814334
gamma = 0.9721246598992744
learning_rate = 0.1
max_grad_norm = 1.8109182724544075
minibatch_size = 65_536
prio_alpha = 0.1
prio_beta0 = 0.8247156461060179
replay_ratio = 1.4242098997083206
vf_clip_coef = 1.2291681640124468
vf_coef = 1.2195502588297364
vtrace_c_clip = 1.0830442742115065
vtrace_rho_clip = 2.1017317041552603
