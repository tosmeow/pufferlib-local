[base]
env_name = nash_impact
async = 0
# Retain each update for comparisons of reward trajectories across training.
# The starter run has 12 updates of 8192 agent steps each.
checkpoint_interval = 1

[vec]
total_agents = 256
num_buffers = 1
num_threads = 1
num_policies = 1
hist_policy_percent = 0

[selfplay]
enabled = 0

[env]
num_agents = 2
# Counts define the population; each directional starts with initial_inventory.
num_directional = 1
num_arbitrageurs = 1
num_trades = 26
initial_inventory = 1.0
impact = 1.0
transaction_cost = 1.0
# Fixed multiplier applied to each agent's negative execution cost.
reward_scale = 1.0

[policy]
hidden_size = 64
num_layers = 2

[train]
# Starter settings, not a tuned or validated experiment.
# The isolated Nash training build applies trainer.patch and requires this
# value. The unpatched shared trainer does not read this option.
reward_clip = 0
total_timesteps = 100_000
learning_rate = 0.001
gamma = 1.0
gae_lambda = 1.0
ent_coef = 0.0
horizon = 32
minibatch_size = 8192
replay_ratio = 1.0
